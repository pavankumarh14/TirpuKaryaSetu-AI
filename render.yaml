# Render Blueprint for TirpuKaryaSetu AI
# This file tells Render how to deploy both frontend and backend

services:
  # Backend API Service
  - type: web
    name: tirpukaryasetu-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tirpukaryasetu-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false  # You must set this manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: APP_NAME
        value: TirpuKaryaSetu AI
      - key: DEBUG
        value: "false"
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: OCR_LANG
        value: eng+kan
      - key: UPLOAD_DIR
        value: ./uploads
      - key: STATIC_DIR
        value: ./static
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: web
    name: tirpukaryasetu-ai
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://tirpukaryasetu-api.onrender.com

# PostgreSQL Database
databases:
  - name: tirpukaryasetu-db
    plan: free
    ipAllowList: []
