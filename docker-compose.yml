version: "3.9"

services:
  db:
    image: postgres:15
    container_name: tirpukaryasetu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tirpukaryasetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tirpukaryasetu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tirpukaryasetu-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: TirpuKaryaSetu AI
      APP_VERSION: 1.0.0
      DEBUG: "true"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tirpukaryasetu
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-1.5-flash
      EMBEDDING_MODEL: text-embedding-004
      UPLOAD_DIR: ./uploads
      STATIC_DIR: ./static
      MAX_FILE_SIZE_MB: 50
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      TESSERACT_CMD: /usr/bin/tesseract
      OCR_LANG: eng+kan
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tirpukaryasetu-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
