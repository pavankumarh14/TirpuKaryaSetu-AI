version: '3.8'

services:
  backend:
    build: .
    container_name: tirpukaryasetu-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tirpukaryasetu
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
    volumes:
      - ./backend:/app/backend

  db:
    image: postgres:15-alpine
    container_name: tirpukaryasetu-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tirpukaryasetu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
